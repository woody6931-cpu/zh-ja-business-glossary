<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>中日商务用语词典</title>
<meta name="description" content="中日贸易、通关、合同、付款常用术语对照，附日语商务邮件模板。">
<style>
  :root {
    --bg: #faf8f5; --card: #ffffff; --text: #1f1d1a; --muted: #6b665f;
    --line: #e6e1d9; --accent: #b4442f; --chip: #f1ece4;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161513; --card: #201e1b; --text: #ece8e1; --muted: #a39d93;
      --line: #34302b; --accent: #e07a62; --chip: #2a2723;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, "Hiragino Sans", "PingFang SC", "Noto Sans CJK SC", "Yu Gothic", sans-serif;
    line-height: 1.6;
  }
  main { max-width: 860px; margin: 0 auto; padding: 32px 16px 64px; }
  h1 { font-size: 1.6rem; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 24px; font-size: .95rem; }
  .sub a { color: var(--accent); }
  input[type=search] {
    width: 100%; font-size: 1.05rem; padding: 12px 14px;
    border: 1px solid var(--line); border-radius: 10px;
    background: var(--card); color: var(--text); outline: none;
  }
  input[type=search]:focus { border-color: var(--accent); }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 14px 0 8px; }
  .chip {
    border: 1px solid var(--line); background: var(--chip); color: var(--text);
    padding: 5px 12px; border-radius: 999px; font-size: .88rem; cursor: pointer;
  }
  .chip.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  .count { color: var(--muted); font-size: .85rem; margin: 6px 0 12px; }
  .term {
    background: var(--card); border: 1px solid var(--line); border-radius: 10px;
    padding: 12px 16px; margin-bottom: 10px;
  }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .lbl { font-size: .72rem; color: var(--muted); letter-spacing: .04em; }
  .zh, .ja { font-size: 1.05rem; font-weight: 600; word-break: break-word; }
  .reading { color: var(--muted); font-size: .85rem; }
  .note { margin-top: 8px; font-size: .88rem; color: var(--muted); border-top: 1px dashed var(--line); padding-top: 8px; }
  .cat { float: right; font-size: .72rem; color: var(--muted); }
  .copy { background: none; border: none; color: var(--accent); cursor: pointer; font-size: .8rem; padding: 0 0 0 6px; }
  .empty, .err { color: var(--muted); text-align: center; padding: 40px 0; }
  footer { margin-top: 40px; color: var(--muted); font-size: .85rem; text-align: center; }
  footer a { color: var(--accent); }
  @media (max-width: 520px) { .row { grid-template-columns: 1fr; gap: 6px; } }
</style>
</head>
<body>
<main>
  <h1>中日商务用语词典</h1>
  <p class="sub">贸易、通关、合同、付款常用术语中日对照。可用中文、日文或读音搜索。
    邮件模板见 <a href="templates/emails.md">templates/emails.md</a>。</p>

  <input type="search" id="q" placeholder="搜索：报关 / 通関 / つうかん …" autofocus>
  <div class="chips" id="chips"></div>
  <div class="count" id="count"></div>
  <div id="list"></div>

  <footer>
    词条有误或想补充？欢迎在 GitHub 提 Issue 或 Pull Request。
  </footer>
</main>

<script>
let terms = [];
let activeCat = "全部";

function parseCSV(text) {
  const rows = [];
  let row = [], field = "", inQ = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (inQ) {
      if (c === '"' && text[i + 1] === '"') { field += '"'; i++; }
      else if (c === '"') inQ = false;
      else field += c;
    } else if (c === '"') inQ = true;
    else if (c === ",") { row.push(field); field = ""; }
    else if (c === "\n" || c === "\r") {
      if (c === "\r" && text[i + 1] === "\n") i++;
      row.push(field); rows.push(row); row = []; field = "";
    } else field += c;
  }
  if (field || row.length) { row.push(field); rows.push(row); }
  const head = rows.shift();
  return rows.filter(r => r.length > 1).map(r => Object.fromEntries(head.map((h, i) => [h, r[i] || ""])));
}

function esc(s) {
  return s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
}

function render() {
  const q = document.getElementById("q").value.trim().toLowerCase();
  const hits = terms.filter(t =>
    (activeCat === "全部" || t.category === activeCat) &&
    (!q || [t.zh, t.ja, t.reading, t.note].some(v => v.toLowerCase().includes(q)))
  );
  document.getElementById("count").textContent = `${hits.length} 条`;
  const list = document.getElementById("list");
  if (!hits.length) { list.innerHTML = '<div class="empty">没有找到，可以换个说法试试</div>'; return; }
  list.innerHTML = hits.map(t => `
    <div class="term">
      <span class="cat">${esc(t.category)}</span>
      <div class="row">
        <div><div class="lbl">中文</div><div class="zh">${esc(t.zh)}</div></div>
        <div><div class="lbl">日本語</div>
          <div class="ja">${esc(t.ja)}<button class="copy" data-c="${esc(t.ja)}">复制</button></div>
          ${t.reading ? `<div class="reading">${esc(t.reading)}</div>` : ""}
        </div>
      </div>
      ${t.note ? `<div class="note">${esc(t.note)}</div>` : ""}
    </div>`).join("");
}

function renderChips() {
  const cats = ["全部", ...new Set(terms.map(t => t.category))];
  const box = document.getElementById("chips");
  box.innerHTML = cats.map(c => `<button class="chip${c === activeCat ? " on" : ""}">${esc(c)}</button>`).join("");
  box.querySelectorAll(".chip").forEach(b => b.onclick = () => { activeCat = b.textContent; renderChips(); render(); });
}

document.getElementById("q").addEventListener("input", render);
document.getElementById("list").addEventListener("click", e => {
  const b = e.target.closest(".copy");
  if (!b) return;
  navigator.clipboard?.writeText(b.dataset.c).then(() => {
    b.textContent = "已复制"; setTimeout(() => b.textContent = "复制", 1200);
  }).catch(() => {});
});

fetch("glossary/terms.csv")
  .then(r => { if (!r.ok) throw new Error(); return r.text(); })
  .then(t => { terms = parseCSV(t); renderChips(); render(); })
  .catch(() => {
    document.getElementById("list").innerHTML =
      '<div class="err">词库加载失败。直接双击打开本地文件时浏览器会拦截读取，上传到 GitHub Pages 后即可正常使用。</div>';
  });
</script>
</body>
</html>
